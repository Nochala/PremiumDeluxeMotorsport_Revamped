
; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
; Premium Deluxe Motorsport Revamped by Nochala
; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
; Boolean options use true / false.
; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
; Control names use GTA / ScriptHookVDotNet control names.
; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[SETTINGS]
; (Default=True)
LOGGING = True

; Randomized vehicele color when viewing vehicles. (Default=False)
RANDOMCOLOR = False

; Enables mouse support while inside the PDM menu. (Default=True)
ENABLEMOUSE = True

; When enabled, vehicle pricing becomes realistic and not GTA based. (Default=False)
RealisticVehPricing = False

[CONTROLS]
; (Default=FrontendRt)
ZOOM = FrontendRt

; (Default=FrontendLt)
ZOOMOUT = FrontendLt

; Controls the input for opening/closing vehicle doors in PDM. (Default=ParachuteBrakeLeft)
DOOR = ParachuteBrakeLeft 

; Controls the input for raising/lowering convertible vehicles roof in PDM. (Default=ParachuteBrakeRight)
ROOF = ParachuteBrakeRight

; (Default=NextCamera)
CAMERA = NextCamera

[ADDONVEHICLES]
; Allows addon vehicles to be added to Premium Deluxe Motorsport
; without editing the individual vehicle category .ini files.
;
; FORMAT:
;
; vehiclemodel = Make, Class, Price
;
; 
; Comon supported classes include:
;
; Compacts, Sedans, SUVs, Coupes, Muscle, Sports, Super, Sports Classics, Motorcycles, Off-Road, Industrial
; Utility, Vans, Cycles, Service, Emergency, Military, Commercial, Open Wheel, Exotic, Classic, Armored
;
; Example: 
m5e39 = BMW, Sedans, 9999999